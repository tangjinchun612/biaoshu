services:
  mysql:
    image: mysql:8.0
    container_name: zhaobiao_mysql
    environment:
      MYSQL_ROOT_PASSWORD: zhaobiao_root_2024
      MYSQL_DATABASE: zhaobiao
      MYSQL_USER: zhaobiao
      MYSQL_PASSWORD: zhaobiao123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: zhaobiao_qdrant
    ports:
      - "6333:6333"
      - "6334:6334" # gRPC（可选）
    volumes:
      - qdrant_data:/qdrant/storage
  app:
    build: .
    container_name: zhaobiao_app
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - VOLCENGINE_API_KEY=${VOLCENGINE_API_KEY:-ark-9d3b46de-5146-4e21-b94e-1aaae8cd5c72-23624}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - HF_ENDPOINT=https://hf-mirror.com
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=zhaobiao
      - MYSQL_PASSWORD=zhaobiao123
      - MYSQL_DATABASE=zhaobiao
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
