# 对比维度配置
dimensions:
  - name: "资质要求"
    description: "企业资质、人员证书、业绩要求等"
    weight: 30
    
  - name: "技术规范"
    description: "技术参数、方案要求、工期等"
    weight: 40
    
  - name: "商务条款"
    description: "报价、付款方式、违约责任等"
    weight: 30

# 提示词配置
prompts:
  extract_requirements: |
    你是一位专业的招标文件分析师。请分析以下招标文件内容，提取所有实质性要求。
    
    【输出格式】
    请以JSON数组格式输出，每个要求包含：
    - category: 所属类别（如"资质要求"/"技术规范"/"商务条款"）
    - requirement: 具体要求内容
    - location: 在文档中的位置（章节/页码）
    - is_mandatory: 是否为强制性要求（true/false）
    
    【招标文件内容】
    {tender_content}
    
  compare_analysis: |
    你是一位专业的标书审查专家。请对比分析以下招标要求和标书响应。
    
    【招标要求】
    {requirement}
    
    【标书响应内容】
    {bid_response}
    
    【分析要求】
    1. 判断标书是否完全响应了招标要求
    2. 识别缺失、偏差或不一致之处
    3. 评估问题严重程度（严重/一般/轻微）
    4. 给出具体修改建议
    
    【输出格式】
    请以JSON格式输出：
    {
      "status": "符合/部分符合/不符合",
      "severity": "严重/一般/轻微",
      "issues": ["问题1", "问题2"],
      "suggestions": ["建议1", "建议2"]
    }

# 评分规则配置
scoring:
  severity_weights:
    "严重": 10
    "一般": 5
    "轻微": 2
  pass_threshold: 80

# 输出配置
output:
  formats: ["json", "markdown", "word"]
  default_format: "json"
  include_original_text: true
