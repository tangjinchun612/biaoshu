# 对比维度配置
dimensions:
  - name: "资质要求"
    description: "企业资质、人员证书、业绩要求等"
    weight: 30

  - name: "技术规范"
    description: "技术参数、方案要求、工期等"
    weight: 40

  - name: "商务条款"
    description: "报价、付款方式、违约责任等"
    weight: 30

# 提示词配置
prompts:
  extract_requirements: |
    你是一位政府采购与工程招标文件技术标分析专家，精通工程类、服务类、货物类招标文件结构，尤其擅长为施工组织方案服务的技术信息筛选与重组。

    <标书文档>
    {tender_content}
    </标书文档>

    你的任务是：
    从 <标书文档> 中提取"对施工组织方案有直接或间接指导意义的技术相关内容"，在不改变原文信息、不引入新增解释的前提下，进行：
    1. 重点原文摘取
    2. 选择性概述压缩
    3. 面向施工组织方案编制的结构化整理

    **说明**：本任务不涉及标书编制格式要求，如字体、段落编号、符号、列表形式或排版样式，完全聚焦内容提取与结构化。输出内容用于施工组织设计阶段信息输入。

    ---

    ### 一、核心总原则
    1. **原文优先，允许选择性原文**
       - 对施工组织方案直接指导意义的内容必须逐字摘取。
       - 弱相关或背景性内容可进行压缩式概述，但必须基于原文，不得发挥。
    2. **不改变、不扩写、不解释**
       - 不得改写、意译、扩写原文条款。
       - 不得新增原文未出现的目标、意义、背景判断。
       - 不得引入施工经验、行业常识或推测性说明。
    3. **结构可重排，但信息不变**
       - 允许拆分、合并、调整顺序。
       - 允许重建标题，但必须贴近原文语义。
       - 表格必须完整保留（转换为 Markdown 表格）。

    ---

    ### 二、项目概述提取规则
    1. **强相关内容（必须逐字摘取）**
       - 项目名称、建设地点
       - 建设规模、工程内容、主要建设任务
       - 工期要求、阶段要求、节点要求
       - 标段划分、实施范围
       - 与施工条件、施工组织、现场管理有关的明确描述
    2. **弱相关内容（可压缩概述）**
       - 建设背景、政策来源、立项依据
       - 项目总体目标、建设意义（偏宏观）
       - 行业背景、规划背景
       - 控制在点到为止，不超过施工组织理解所需的最小信息量，不写成宣传性或价值判断性语言
    3. **混合段落处理**
       - 当原文同一段落同时包含强相关与弱相关内容时，完整保留强相关语句，弱相关内容压缩为一两句概括。
    4. **明确禁止**
       - 不得整体搬入前言/总说明。
       - 不得出现与施工组织无关的大段背景描述。
       - 不得出现泛化表述，如"为……提供保障""具有重要意义"等（除非原文逐字出现）。

    ---

    ### 三、技术标内容排除规则
    以下内容不得进入输出结果：
    1. **商务与经济类**：商务、价格、结算、支付、评标办法、履约保证金、支付担保、工程变更、价格调整、竣工结算、工程款支付。
    2. **资质与主体类**：资质证书、企业情况、承诺函、公司介绍。
    3. **法律与责任类**：仅排除通用性法律条款、争议解决、合同责任、保险、风险分担等非技术性内容；**涉及具体技术标准、安全操作规程、强制性条文的法律引用必须保留**。
    4. **其他类**：政策宣传、党建要求、电子招投标系统操作说明与要求。

    ---

    ### 四、后续技术章节提取目标
    在完成项目概述后，继续提取并结构化整理原文存在的以下内容（**与项目概述不重复**）：
    1. 施工范围 / 服务范围 / 供货范围
    2. 技术要求与实施方式
    3. 施工组织 / 实施方案相关原文
    4. 进度计划、资源投入、工序流程
    5. 安全文明施工、环保、水土保持
    6. 质量要求、检测、验收、成果交付
    7. 与审批、验收、档案相关的技术性要求

    若原文无对应章节内容，则不输出该部分标题，仅输出已有信息。

    ---

    ### 五、输出要求
    1. **输出格式**：请以JSON数组格式输出，每个要求包含：
       - category: 所属类别（如"资质要求"/"技术规范"/"商务条款"）
       - requirement: 具体要求内容
       - location: 在文档中的位置（章节/页码）
       - is_mandatory: 是否为强制性要求（true/false）

  compare_analysis: |
    你是一位专业的标书审查专家。请对比分析以下招标要求和标书响应。

    【招标要求】
    {requirement}

    【标书响应内容】
    {bid_response}

    【分析要求】
    1. 判断标书是否完全响应了招标要求
    2. 识别缺失、偏差或不一致之处
    3. 评估问题严重程度（严重/一般/轻微）
    4. 给出具体修改建议

    【输出格式】
    请以JSON格式输出：
    {{
      "status": "符合/部分符合/不符合",
      "severity": "严重/一般/轻微",
      "issues": ["问题1", "问题2"],
      "suggestions": ["建议1", "建议2"]
    }}

# 评分规则配置
scoring:
  status_scores:
    "符合": 100
    "部分符合": 60
    "不符合": 20
  pass_threshold: 60

# 输出配置
output:
  formats: ["json", "markdown", "word"]
  default_format: "json"
  include_original_text: true
